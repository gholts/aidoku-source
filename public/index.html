<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta
			name="description"
			content="Chinese novel sources for Aidoku."
		/>
		<title>Aidoku Novel Sources</title>
		<meta property="og:title" content="Aidoku Novel Sources" />
		<meta
			property="og:description"
			content="Chinese novel sources for Aidoku."
		/>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<a
			href="#"
			id="github-link"
			style="display: none"
			target="_blank"
			rel="noopener"
			aria-label="GitHub Repository"
		>
			<svg
				viewBox="0 0 16 16"
				width="28"
				height="28"
				fill="currentColor"
				aria-hidden="true"
			>
				<path
					d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
					0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52
					-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2
					-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64
					-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08
					2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
					1.93-.01 2.19 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
				/>
			</svg>
		</a>
		<header>
			<h1 class="main-heading">Aidoku Novel Sources</h1>
			<p class="main-description">
				Install and update Chinese novel sources from within Aidoku.
			</p>
		</header>
		<main>
			<div id="add-repo-btn" style="display: none">
				<button
					onclick="addRepository()"
				>
					Add Repository
				</button>
				<p>Requires <b>Aidoku 0.7</b> or newer.</p>
			</div>
			<div id="non-apple-note" style="display: none">
				<p>
					You can add this repository inside the Aidoku app in the
					<b>Settings</b> tab under <b>Source Lists</b> by entering:
					<code id="source-list-url"></code>
				</p>
			</div>
			<div id="filter-container">
				<div class="filter-group">
					<label for="source-search" class="filter-label">
						Search
					</label>
					<input
						type="text"
						id="source-search"
						placeholder="Search sources..."
						autocomplete="off"
					/>
				</div>
				<div id="filter-menus-row">
					<div class="filter-group">
						<label for="language-select" class="filter-label">
							Language
						</label>
						<div class="select-wrapper">
							<select id="language-select">
								<option value="">All Languages</option>
							</select>
							<svg
								class="select-chevron"
								xmlns="http://www.w3.org/2000/svg"
								viewBox="0 0 1024 1024"
								width="18"
								height="18"
							>
								<path
									fill="currentColor"
									d="M831.872 340.864 512 652.672 192.128 340.864a30.592 30.592 0 0 0-42.752 0 29.12 29.12 0 0 0 0 41.6L489.664 714.24a32 32 0 0 0 44.672 0l340.288-331.712a29.12 29.12 0 0 0 0-41.728 30.592 30.592 0 0 0-42.752 0z"
								></path>
							</svg>
						</div>
					</div>
					<div class="filter-group">
						<label for="rating-select" class="filter-label">
							Content Rating
						</label>
						<div class="select-wrapper">
							<select id="rating-select">
								<option value="">All Content Ratings</option>
								<option value="safe">Safe</option>
								<option value="contains-nsfw">
									Contains NSFW
								</option>
								<option value="nsfw">NSFW</option>
							</select>
							<svg
								class="select-chevron"
								xmlns="http://www.w3.org/2000/svg"
								viewBox="0 0 1024 1024"
								width="18"
								height="18"
							>
								<path
									fill="currentColor"
									d="M831.872 340.864 512 652.672 192.128 340.864a30.592 30.592 0 0 0-42.752 0 29.12 29.12 0 0 0 0 41.6L489.664 714.24a32 32 0 0 0 44.672 0l340.288-331.712a29.12 29.12 0 0 0 0-41.728 30.592 30.592 0 0 0-42.752 0z"
								></path>
							</svg>
						</div>
					</div>
				</div>
			</div>
			<noscript>
				You need to enable JavaScript to see and filter sources.
			</noscript>
			<div class="source-list-header-row">
				<span class="total-count" id="total-count"></span>
			</div>
			<div id="source-list"></div>
		</main>
		<script>
			(function () {
				const sourceListURL = new URL(
					"index.min.json",
					window.location.href,
				).href;
				document.getElementById("source-list-url").textContent =
					sourceListURL;
				window.addRepository = function () {
					window.location =
						"aidoku://addSourceList?url=" +
						encodeURIComponent(sourceListURL);
				};

				const githubPagesOwner = window.location.hostname.match(
					/^([^.]+)\.github\.io$/,
				)?.[1];
				const repository = window.location.pathname
					.split("/")
					.filter(Boolean)[0];
				if (githubPagesOwner && repository) {
					const githubLink = document.getElementById("github-link");
					githubLink.href =
						`https://github.com/${githubPagesOwner}/${repository}`;
					githubLink.style.display = "";
				}

				// Show deep link only on Apple devices.
				const ua = navigator.userAgent.toLowerCase();
				const isApple = /iphone|ipad|ipados|macintosh|mac os x/.test(
					ua,
				);
				const btn = document.getElementById("add-repo-btn");
				const note = document.getElementById("non-apple-note");
				if (btn && isApple) btn.style.display = "";
				if (note && !isApple) note.style.display = "";
			})();
		</script>
		<script src="main.js" defer></script>
	</body>
</html>
